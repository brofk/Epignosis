name: Website security tests

on:
  pull_request:
    branches: [sites-wpmn-ecf]
    paths:
      - 'wpmn-ecf-website/**'
      - '.github/workflows/website-security-tests.yml'

permissions:
  contents: read

concurrency:
  group: website-security-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  website-security-tests:
    name: Website security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wpmn-ecf-website
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: wpmn-ecf-website/pnpm-lock.yaml
      - name: Install pinned dependencies
        run: npm run install:ci
      - name: Run security tests
        run: npm run test:security
      - name: Run D1 concurrency test
        run: npm run test:security:d1
      - name: Type-check
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Build production site
        run: npm run build
