name: Website security tests

on:
  pull_request:
    branches: [main, sites-wpmn-ecf]
  push:
  merge_group:

permissions:
  contents: read

concurrency:
  group: website-security-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  website-unit-tests:
    name: Website unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wpmn-ecf-website
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Fast tests and 60 percent coverage floor
        run: npm run test:unit

  website-security-tests:
    name: Website security tests
    needs: website-unit-tests
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/sites-wpmn-ecf'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wpmn-ecf-website
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: API journeys, local D1, migrations and coverage
        run: npm run test:integration
      - name: Type-check
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Build production site
        run: npm run build
