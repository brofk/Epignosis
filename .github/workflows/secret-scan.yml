name: Secret scanning
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified scanner
        run: sh scripts/security/install-gitleaks-ci.sh
      - name: Test scanning controls
        run: python3 -m unittest discover -s tests -p 'test_secret_controls.py'
      - name: Scan reachable history and tracked file names
        run: sh scripts/security/scan-secrets.sh history
