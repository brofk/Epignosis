name: Weekly AI cost report
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Collect retained usage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/collect-ai-usage.py
      - name: Generate weekly breakdown
        run: node .github/scripts/ai-report.mjs telemetry
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weekly-ai-cost-${{ github.run_id }}
          path: |
            weekly-ai-cost.md
            weekly-ai-cost.json
          retention-days: 90
          if-no-files-found: error
